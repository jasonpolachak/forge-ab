<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Forge"/>
<meta name="theme-color" content="#0c0620"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Forge 0.6.10</title>
<style>
:root,html[data-theme="outrun"]{
  --field:#0c0620;--card:#1a1333;--text:#f4f0ff;--muted:#8eb8c9;--border:#3e2f62;
  --well:#120c28;--icon:#2a2150;--primary:#ff2e9a;--ink:#1a0412;--cyan:#2de8ff;--ready:#2a0d22;--status:#16102c;
}
html[data-theme="gym"]{
  --field:#101214;--card:#222830;--text:#f6f3ec;--muted:#b0b8c2;--border:#3a4350;
  --well:#181c21;--icon:#2a333d;--primary:#f0b429;--ink:#14110a;--cyan:#b0b8c2;--ready:#2a2410;--status:#1c2430;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--field);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--ink);font-weight:800;display:grid;place-items:center}
.logo[onclick]{cursor:pointer}
h1,p{margin:0}
small{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ver{font-size:11px;font-weight:800;background:var(--primary);color:var(--ink);border-radius:99px;padding:4px 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.label{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.name{font-size:26px;font-weight:800}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:16px;margin-top:8px;color:var(--ink);background:var(--primary)}
.btn2{background:transparent;color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input{width:100%;background:var(--well);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font:inherit}
.set{display:grid;grid-template-columns:32px 1fr 52px 52px;gap:8px;align-items:center;background:var(--well);border:2px solid var(--border);border-radius:14px;padding:10px;margin-top:10px}
.set.hit{background:#143322;border-color:#3dba7a}
.set.miss{background:#3a1c18;border-color:#e15b4a}
.set .tag{font-size:11px;font-weight:800;letter-spacing:.06em}
.set.hit .tag{color:#3dba7a}
.set.miss .tag{color:#ffb4ab}
.icon{width:52px;height:52px;border:0;border-radius:14px;background:var(--icon);color:var(--text);font-size:22px;font-weight:800}
.set.hit .icon.go{background:#3dba7a;color:#062214}
.set.miss .icon.no{background:#e15b4a;color:#2a0c0a}
.muted{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);padding:10px 14px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;z-index:30}
.toast.show{opacity:1}
.unit{flex:0 0 48px;text-align:center;font-weight:800}
.status{background:var(--status);border-radius:12px;padding:12px;margin-bottom:12px}
.clock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.restbar{position:sticky;bottom:0;margin:16px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#0e2a1c;border-top:2px solid #3dba7a;z-index:20}
.restbar.go{background:#0e2a1c}
.restbar.done{background:var(--ready);border-top-color:var(--primary)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--well);border-radius:12px;padding:10px}
.stat .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
.spark.big{height:96px}
.spark i{flex:1;background:var(--primary);border-radius:2px 2px 0 0;display:block;min-width:3px;min-height:3px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:800;font-size:12px}
.seg button.on{background:var(--primary);color:var(--ink);border-color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal i{display:block;aspect-ratio:1;border-radius:50%;background:var(--well);border:1px solid var(--border)}
.cal i.on{background:var(--primary);border-color:var(--primary)}
.cal i.fut{opacity:.25}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.wd span{text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.wbig{font-size:48px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.why{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0 0}
.quiet{display:block;width:auto;padding:8px 0 0;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px}
.park .name{font-size:18px}
</style>
</head>
<body>
<div class="app" id="app">Loading…</div>
<div class="toast" id="toast"></div>
<script>
var V="0.6.10",K="forge-ab-v1";
var SAVE_KEYS=["units","rest","sound","last","theme","graph","fail","hist","A","B","C","sess","programId","goal","daysWk","gear"];
var D={units:"lb",rest:90,sound:0,last:null,theme:"outrun",graph:"w",fail:{},hist:[],programId:null,goal:null,daysWk:null,gear:null,
A:{name:"Workout A",ex:[
{id:"squat",n:"Squat",s:5,r:5,inc:5,w:45,seed:"bar"},
{id:"bench",n:"Bench Press",s:5,r:5,inc:5,w:45,seed:"bar"},
{id:"row",n:"Barbell Row",s:5,r:5,inc:5,w:65,seed:"bar"}]},
B:{name:"Workout B",ex:[
{id:"squat",n:"Squat",s:5,r:5,inc:5,w:45,seed:"bar"},
{id:"ohp",n:"Overhead Press",s:5,r:5,inc:5,w:45,seed:"bar"},
{id:"dl",n:"Deadlift",s:1,r:5,inc:10,w:95,seed:"bar"}]}};
var PARKED=[
  {id:"madcow-5x5",name:"Madcow 5×5"},
  {id:"531-beginner",name:"5/3/1 Beginner"}
];
var ALL_IDS=["stronglifts-5x5","starting-strength","greyskull-lp","gzclp","upper-lower","upper-lower-db","ppl","ppl-db","db-full-body","bodyweight","bodyweight-3d"];
function clone(o){return JSON.parse(JSON.stringify(o))}
function X(id,n,s,r,inc,w,opt){
  var e={id:id,n:n,s:s,r:r,inc:inc,w:w};
  if(opt) Object.keys(opt).forEach(function(k){e[k]=opt[k]});
  return e;
}
function custom(day){return X("custom_"+day,"",3,8,0,0,{prog:"log",optional:1})}
function logx(id,n){return X(id,n,3,8,0,0,{prog:"log"})}
function bar(id,n,s,r,inc,w){return X(id,n,s,r,inc,w,{seed:"bar",prog:"linear"})}
function dbx(id,n,s,r,inc,w){return X(id,n,s,r,inc,w==null?10:w,{seed:"db",prog:"linear",floor:10})}
function bw(id,n){return X(id,n,3,8,5,0,{seed:"bw",prog:"bw",repCap:12,rFloor:5})}
function pull(id,n,cap){return X(id,n,3,8,5,0,{seed:"bw",prog:"pullup",repCap:cap||12,rFloor:5,floor:0})}
function day(name,ex){return {name:name,ex:ex}}
function jasonTemplate(){
  return {
    A:day("Workout A",[
      bar("squat","Squat",5,5,5,45),
      bar("bench","Bench Press",5,5,5,45),
      pull("pullup","Pull-up",12),
      logx("situp","Sit-ups"),
      logx("curl","Arm curls"),
      logx("swing","Kettlebell swings"),
      custom("A")
    ]),
    B:day("Workout B",[
      bar("squat","Squat",5,5,5,45),
      bar("ohp","Overhead Press",5,5,5,45),
      bar("dl","Deadlift",1,5,10,95),
      logx("situp","Sit-ups"),
      logx("curl","Arm curls"),
      custom("B")
    ])
  };
}
var PROGRAMS={
  "stronglifts-5x5":{name:"StrongLifts 5×5",blurb:"A/B. Squat, bench, row / squat, OHP, deadlift 1×5. Linear +5, deadlift +10.",
    make:function(){return {
      A:day("Workout A",[bar("squat","Squat",5,5,5,45),bar("bench","Bench Press",5,5,5,45),bar("row","Barbell Row",5,5,5,65),custom("A")]),
      B:day("Workout B",[bar("squat","Squat",5,5,5,45),bar("ohp","Overhead Press",5,5,5,45),bar("dl","Deadlift",1,5,10,95),custom("B")])
    }}},
  "starting-strength":{name:"Starting Strength",blurb:"A/B. Squat/bench/deadlift · squat/OHP/power clean. Squat and deadlift +10.",
    make:function(){return {
      A:day("Workout A",[bar("squat","Squat",3,5,10,45),bar("bench","Bench Press",3,5,5,45),bar("dl","Deadlift",1,5,10,95),custom("A")]),
      B:day("Workout B",[bar("squat","Squat",3,5,10,45),bar("ohp","Overhead Press",3,5,5,45),bar("pc","Power Clean",5,3,5,45),custom("B")])
    }}},
  "greyskull-lp":{name:"Greyskull LP",blurb:"A/B. 2×5 + AMRAP. Hit if last ≥5. Chin-ups: reps then load.",
    make:function(){
      var am={lastAmrap:1,prog:"gslp",seed:"bar"};
      return {
        A:day("Workout A",[X("squat","Squat",3,5,10,45,am),X("bench","Bench Press",3,5,5,45,am),pull("chin","Chin-up",8),custom("A")]),
        B:day("Workout B",[X("ohp","Overhead Press",3,5,5,45,am),X("dl","Deadlift",1,5,10,95,am),pull("chin","Chin-up",8),custom("B")])
      };
    }},
  "gzclp":{name:"GZCLP",blurb:"A/B/C. T1 5×3 last AMRAP, T2 3×10, T3 log-only. Real C day.",
    make:function(){
      function t1(id,n,inc,w){return X(id,n,5,3,inc,w,{seed:"bar",prog:"t1",lastAmrap:1})}
      function t2(id,n,w){return X(id,n,3,10,5,w,{seed:"bar",prog:"t2",t2r:10})}
      function t3(id,n,seed,w){return X(id,n,3,15,0,w,{seed:seed,prog:"log"})}
      return {
        A:day("Workout A",[t1("squat_t1","Squat (T1)",10,45),t2("bench_t2","Bench Press (T2)",45),t3("lat","Lat pulldown","bw",0),custom("A")]),
        B:day("Workout B",[t1("ohp_t1","Overhead Press (T1)",5,45),t2("dl_t2","Deadlift (T2)",95),t3("dbrow_t3","DB row","db",10),custom("B")]),
        C:day("Workout C",[t1("bench_t1","Bench Press (T1)",5,45),t2("squat_t2","Squat (T2)",45),t3("lat","Lat pulldown","bw",0),custom("C")])
      };
    }},
  "upper-lower":{name:"Upper/Lower",blurb:"Upper: bench 5×5, OHP 3×8, row 5×5. Lower: squat 5×5, deadlift 1×5.",
    make:function(){return {
      A:day("Upper",[bar("bench","Bench Press",5,5,5,45),bar("ohp","Overhead Press",3,8,5,45),bar("row","Barbell Row",5,5,5,65),custom("A")]),
      B:day("Lower",[bar("squat","Squat",5,5,5,45),bar("dl","Deadlift",1,5,10,95),custom("B")])
    }}},
  "upper-lower-db":{name:"Upper/Lower (dumbbells)",blurb:"DB bench, OHP, row / goblet squat, DB deadlift. Floor 10 lb.",
    make:function(){return {
      A:day("Upper",[dbx("bench","DB Bench",5,5,5),dbx("ohp","DB Overhead Press",3,8,5),dbx("row","DB Row",5,5,5),custom("A")]),
      B:day("Lower",[dbx("squat","Goblet Squat",5,5,5),dbx("dl","DB Deadlift",1,5,5),custom("B")])
    }}},
  "ppl":{name:"Push/Pull/Legs",blurb:"Push, pull, legs rotating. Real C day. Pull-ups: reps then load.",
    make:function(){return {
      A:day("Push",[bar("bench","Bench Press",5,5,5,45),bar("ohp","Overhead Press",3,8,5,45),custom("A")]),
      B:day("Pull",[pull("pullup","Pull-up",12),bar("row","Barbell Row",5,5,5,65),custom("B")]),
      C:day("Legs",[bar("squat","Squat",5,5,5,45),bar("dl","Deadlift",1,5,10,95),custom("C")])
    }}},
  "ppl-db":{name:"Push/Pull/Legs (dumbbells)",blurb:"DB press and goblet. Pull-ups stay. Floor 10 lb except pull-ups.",
    make:function(){return {
      A:day("Push",[dbx("bench","DB Bench",5,5,5),dbx("ohp","DB Overhead Press",3,8,5),custom("A")]),
      B:day("Pull",[pull("pullup","Pull-up",12),dbx("row","DB Row",5,5,5),custom("B")]),
      C:day("Legs",[dbx("squat","Goblet Squat",5,5,5),dbx("dl","DB Deadlift",1,5,5),custom("C")])
    }}},
  "db-full-body":{name:"Full-body dumbbell",blurb:"A: goblet, DB bench, DB row. B: DB RDL, DB OHP, reverse lunge. 3×8.",
    make:function(){return {
      A:day("Workout A",[dbx("squat","Goblet Squat",3,8,5),dbx("bench","DB Bench",3,8,5),dbx("row","DB Row",3,8,5),custom("A")]),
      B:day("Workout B",[dbx("rdl","DB RDL",3,8,5),dbx("ohp","DB Overhead Press",3,8,5),dbx("lunge","Reverse Lunge",3,8,5),custom("B")])
    }}},
  "bodyweight":{name:"Bodyweight strength",blurb:"A/B. 3×8, reps then load. Start not tested.",
    make:function(){return {
      A:day("Workout A",[bw("bw_squat","Squat"),bw("pushup","Push-up"),pull("pullup","Pull-up",12),custom("A")]),
      B:day("Workout B",[bw("lunge","Reverse Lunge"),bw("pike","Pike Push-up"),bw("invrow","Inverted Row"),custom("B")])
    }}},
  "bodyweight-3d":{name:"Bodyweight strength (3-day)",blurb:"A/B plus C for 5–6 days. Glute bridge, dip, pull-up on C.",
    make:function(){
      var t=PROGRAMS.bodyweight.make();
      t.C=day("Workout C",[bw("glute","Glute Bridge"),bw("dip","Dip"),pull("pullup","Pull-up",12),custom("C")]);
      return t;
    }}
};
function skipQuiz(p){
  if(!p||typeof p!=="object") return false;
  if(p.programId) return true;
  if(p.hist&&p.hist.length) return true;
  if(p.last) return true;
  if(p.A&&p.A.ex&&p.A.ex.length) return true;
  if(p.B&&p.B.ex&&p.B.ex.length) return true;
  return false;
}
function mergeSave(p){
  var o=clone(D);
  SAVE_KEYS.forEach(function(k){if(p&&p[k]!=null)o[k]=p[k]});
  if(!o.rest) o.rest=90;
  if(skipQuiz(p)&&!o.programId) o.programId="stronglifts-5x5";
  if(!o.C) delete o.C;
  return o;
}
function loadRaw(){
  try{return JSON.parse(localStorage.getItem(K)||"null")}catch(e){return null}
}
function load(){
  var p=loadRaw();
  if(!p) return clone(D);
  return mergeSave(p);
}
var S=load(),view="home",sess=null,timer=null,left=0,restEnds=0,lastRes=[],lastMarked=0,restTold=0,wakeLock=null,logForm=null;
var quiz={step:0,goal:null,daysWk:null,gear:null},pickFrom="onboard";
if(!S.rest) S.rest=90;
var rawBoot=loadRaw();
if(!rawBoot) view="quiz";
else if(!skipQuiz(rawBoot)) view="quiz";
else if(!rawBoot.programId){S.programId="stronglifts-5x5";save()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function persistSess(){
  if(!sess){S.sess=null;save();return}
  S.sess={k:sess.k,i:sess.i,ex:sess.ex,restEnds:restEnds||0,lastMarked:lastMarked};
  save();
}
function keepAwake(){
  try{
    if(!navigator.wakeLock||!navigator.wakeLock.request)return;
    navigator.wakeLock.request("screen").then(function(s){
      if(wakeLock&&wakeLock!==s){try{wakeLock.release()}catch(e){}}
      wakeLock=s;
    }).catch(function(){});
  }catch(e){}
}
function dropWake(){
  try{if(wakeLock)wakeLock.release()}catch(e){}
  wakeLock=null;
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1600)}
function dayKeys(){
  var k=["A","B"];
  if(S.C&&S.C.ex&&S.C.ex.length) k.push("C");
  return k;
}
function next(){
  var keys=dayKeys(),i=keys.indexOf(S.last);
  if(i<0) return keys[0];
  return keys[(i+1)%keys.length];
}
function theme(){return S.theme==="gym"?"gym":"outrun"}
function graph(){return S.graph==="e1rm"||S.graph==="vol"||S.graph==="reps"?S.graph:"w"}
function applyTheme(){
  var t=theme(), color=t==="gym"?"#101214":"#0c0620";
  document.documentElement.setAttribute("data-theme",t);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",color);
}
function toggleTheme(){S.theme=theme()==="outrun"?"gym":"outrun";save();applyTheme();draw()}
function u(){return S.units==="kg"?"kg":"lb"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return c==="&"?"&"+"amp;":c==="<"? "&"+"lt;":c===">"?"&"+"gt;":"&"+"quot;"})}
function bump(id,fn){dayKeys().forEach(function(k){S[k].ex.forEach(function(e){if(e.id===id)fn(e)})})}
function programName(){return (PROGRAMS[S.programId]&&PROGRAMS[S.programId].name)||"StrongLifts 5×5"}
function recommend(goal,daysWk,gear){
  if(gear==="bb"){
    if(daysWk==="23") return goal==="muscle"?"greyskull-lp":"stronglifts-5x5";
    if(daysWk==="4") return "upper-lower";
    return "ppl";
  }
  if(gear==="db"){
    if(daysWk==="23") return "db-full-body";
    if(daysWk==="4") return "upper-lower-db";
    return "ppl-db";
  }
  return daysWk==="56"?"bodyweight-3d":"bodyweight";
}
function eightIds(){
  var g=S.gear||quiz.gear||"bb";
  var d=S.daysWk||quiz.daysWk||"23";
  return ["stronglifts-5x5","starting-strength","greyskull-lp","gzclp",
    g==="db"?"upper-lower-db":"upper-lower",
    g==="db"?"ppl-db":"ppl",
    "db-full-body",
    d==="56"?"bodyweight-3d":"bodyweight"];
}
function continueFive(){
  if(skipQuiz(loadRaw())) return;
  var t=jasonTemplate();
  S.programId="stronglifts-5x5";
  S.A=t.A; S.B=t.B;
  delete S.C;
  save();
  go("home");
}
function applyProgram(id){
  var p=PROGRAMS[id]; if(!p) return;
  var t=p.make();
  S.programId=id;
  S.A=t.A; S.B=t.B;
  if(t.C) S.C=t.C; else delete S.C;
  S.fail={}; S.last=null; S.sess=null; sess=null;
  save();
}
function chooseProgram(id){
  if(!PROGRAMS[id]) return;
  if(pickFrom==="change"){
    if(!confirm("Switch to "+PROGRAMS[id].name+"? History stays on this phone. Lifts become the new template. Current working weights for this program are replaced.")) return;
  }
  applyProgram(id);
  go("home");
  toast(PROGRAMS[id].name);
}
function goPick(){pickFrom="change";go("pick")}
function scheme(e){
  if(e.lastAmrap&&e.s>1) return (e.s-1)+"×"+e.r+" + AMRAP";
  if(e.lastAmrap&&e.s===1) return "1×AMRAP ("+e.r+"+)";
  return e.s+"×"+e.r;
}
function seedNote(e){
  if(!e) return "";
  if(e.seed==="bar"&&e.w===45&&(e.id==="squat"||e.id==="bench"||e.id==="ohp"||e.id==="pc"||e.id==="squat_t1"||e.id==="bench_t1"||e.id==="ohp_t1"||e.id==="bench_t2"||e.id==="squat_t2")) return "empty bar";
  if(e.seed==="bar"&&e.id==="row"&&e.w===65) return "empty bar";
  if(e.seed==="bar"&&(e.id==="dl"||e.id==="dl_t2")&&e.w===95) return "empty bar";
  if((e.seed==="bw"||e.prog==="pullup"||e.prog==="bw")&&!e.w) return "not tested";
  return "";
}
function header(title,back,sub){
  var mark=back?'<button class="icon" onclick="go(\'home\')">←</button>':(view==="home"?'<div class="logo">F</div>':'<div class="logo" onclick="logoTap()">F</div>');
  return '<div class="top"><div class="brand">'+mark+
    '<div><h1>'+esc(title)+'</h1><small>'+esc(sub||programName())+'</small></div></div><span class="ver">v'+V+'</span></div>';
}
function liftBlock(k,e,i){
  var note=seedNote(e);
  var html='<div class="label" style="margin-top:10px">'+(e.optional?'Custom (optional)':esc(e.n||"Custom"))+' · '+scheme(e)+'</div>';
  if(e.optional){
    html+='<input placeholder="Name this lift to add it" value="'+esc(e.n)+'" onchange="S.'+k+'.ex['+i+'].n=this.value;save();draw()">';
    if(!e.n) return html;
  }
  html+='<div class="row">'+

function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    var ctx=new AC();
    var now=ctx.currentTime;
    for(var i=0;i<3;i++){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, now+i*0.22);
      g.gain.exponentialRampToValueAtTime(0.2, now+i*0.22+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+i*0.22+0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+i*0.22); o.stop(now+i*0.22+0.18);
    }
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}

    if(!restTold){
      restTold=1;
      toast("Rest over");

}

function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=String(s%60);if(x.length<2)x="0"+x;return m+":"+x}
function rnd(n){return Math.round(n*2)/2}
function floorW(e){
  if(e.floor!=null) return e.floor;
  if(e.prog==="bw"||e.prog==="pullup"||e.prog==="log") return 0;
  if(e.seed==="db") return 10;
  return S.units==="kg"?20:45;
}
function loadStep(e){return +e.inc||step()}
function logged(e){return e.log.some(function(s){return s.ok===1||s.ok===2})}
function allHit(e){return e.log.every(function(s){return s.ok===1&&s.r>=e.r})}
function anyMiss(e){return e.log.some(function(s){return s.ok===2||(s.ok===1&&s.r<e.r)})}
function lastSet(e){return e.log[e.log.length-1]}
function earlyMiss(e){return e.log.slice(0,-1).some(function(s){return s.ok===2||(s.ok===1&&s.r<e.r)})}
function applyLinear(e,missN){
  missN=missN||3;
  if(allHit(e)){S.fail[e.id]=0;bump(e.id,function(x){x.w=rnd((+x.w)+(+x.inc||5))});return {hit:1,msg:"hit — weight up next time"}}
  if(anyMiss(e)){
    S.fail[e.id]=(S.fail[e.id]||0)+1;
    if(S.fail[e.id]>=missN){bump(e.id,function(x){x.w=rnd(Math.max(floorW(x),x.w*0.9))});S.fail[e.id]=0;return {hit:0,msg:"deload"}}
    return {hit:0,msg:"same weight"}
  }
  return {hit:0,msg:"skipped"}
}
function applyGslp(e){
  if(!logged(e)) return {hit:0,msg:"skipped"};
  var last=lastSet(e), ok=!earlyMiss(e)&&last.ok===1&&last.r>=5;
  if(ok){S.fail[e.id]=0;bump(e.id,function(x){x.w=rnd((+x.w)+(+x.inc||5))});return {hit:1,msg:"hit — weight up next time"}}
  S.fail[e.id]=(S.fail[e.id]||0)+1;
  if(S.fail[e.id]>=2){bump(e.id,function(x){x.w=rnd(Math.max(floorW(x),x.w*0.9))});S.fail[e.id]=0;return {hit:0,msg:"deload"}}
  return {hit:0,msg:"same weight"}
}
function applyT1(e){
  if(!logged(e)) return {hit:0,msg:"skipped"};
  var last=lastSet(e), bad=earlyMiss(e)||last.ok===2;
  var lr=+last.r||0;
  if(!bad&&last.ok===1&&lr>=10){S.fail[e.id]=0;bump(e.id,function(x){x.w=rnd((+x.w)+(+x.inc||5))});return {hit:1,msg:"AMRAP "+lr+" — weight up"}}
  if(!bad&&last.ok===1&&lr>=3&&lr<=9){return {hit:0,msg:"same weight"}}
  S.fail[e.id]=(S.fail[e.id]||0)+1;
  if(S.fail[e.id]>=3){bump(e.id,function(x){x.w=rnd(Math.max(floorW(x),x.w*0.9))});S.fail[e.id]=0;return {hit:0,msg:"deload"}}
  return {hit:0,msg:"same weight"}
}
function applyT2(e){
  if(allHit(e)){S.fail[e.id]=0;bump(e.id,function(x){x.w=rnd((+x.w)+(+x.inc||5))});return {hit:1,msg:"hit — weight up next time"}}
  if(anyMiss(e)){
    S.fail[e.id]=(S.fail[e.id]||0)+1;
    if(S.fail[e.id]>=3){
      S.fail[e.id]=0;
      bump(e.id,function(x){
        var t=x.t2r||x.r||10;
        if(t>=10){x.t2r=8;x.r=8;x.s=3}
        else if(t>=8){x.t2r=6;x.r=6;x.s=3}
        else {x.t2r=10;x.r=10;x.s=3;x.w=rnd(Math.max(floorW(x),x.w*0.9))}
      });
      return {hit:0,msg:"scheme change"}
    }
    return {hit:0,msg:"same weight"}
  }
  return {hit:0,msg:"skipped"}
}
function applyRepLoad(e){
  var cap=e.repCap||12;
  if(allHit(e)){
    S.fail[e.id]=0;
    bump(e.id,function(x){
      var nr=(+x.r||8)+1, cap2=x.repCap||cap;
      if(nr>cap2){x.r=8;x.w=rnd((+x.w||0)+loadStep(x))}
      else x.r=nr;
    });
    return {hit:1,msg:"hit — reps or load up"}
  }
  if(anyMiss(e)){
    S.fail[e.id]=(S.fail[e.id]||0)+1;
    if(S.fail[e.id]>=3){
      S.fail[e.id]=0;
      bump(e.id,function(x){
        if((+x.w||0)>0){x.w=rnd(Math.max(0,x.w-loadStep(x)));x.r=8}
        else x.r=Math.max(x.rFloor||5,(+x.r||8)-1);
      });
      return {hit:0,msg:"deload"}
    }
    return {hit:0,msg:"same"}
  }
  return {hit:0,msg:"skipped"}
}
function applyLift(e){
  var p=e.prog||"linear";
  if(p==="log") return {hit:0,msg:"logged"};
  if(p==="gslp") return applyGslp(e);
  if(p==="t1") return applyT1(e);
  if(p==="t2") return applyT2(e);
  if(p==="bw"||p==="pullup") return applyRepLoad(e);
  return applyLinear(e,3);
}
function nxt(){
  if(sess.i<sess.ex.length-1){sess.i++; lastMarked=0; startRest(); draw(); return}
  lastRes=sess.ex.map(function(e){
    var r=applyLift(e);
    return {id:e.id,n:e.n,w:e.w,hit:r.hit,msg:r.msg};
  });
  S.last=sess.k;
  S.hist.unshift({
    k:sess.k,
    at:Date.now(),
    lifts:sess.ex.map(function(e){
      return {
        id:e.id,n:e.n,w:e.w,s:e.s,r:e.r,
        sets:e.log.map(function(s){return {r:s.r,ok:s.ok}}),
        hit:e.log.every(function(s){return s.ok===1&&s.r>=e.r})
      };
    })
  });
  S.hist=S.hist.slice(0,40);
  S.sess=null; save(); sess=null; dropWake(); go("done");
}

      '<button class="btn btn2" onclick="S.'+k+'.ex.splice('+i+',1);save();draw()">Remove lift</button>';
  });
  html+='<button class="btn" onclick="S.'+k+'.ex.push({id:\'ex\'+Math.random().toString(36).slice(2,7),n:\'New lift\',s:3,r:8,inc:5,w:'+(S.units==="kg"?20:45)+',prog:\'linear\'});save();draw()">+ Add lift</button></div>';
  return html;
}
function histView(){
  var html=header("History",1);
  html+='<div class="card">';
  if(!S.hist.length) html+='<p class="muted">No sessions saved yet.</p>';
  html+='<button class="btn" onclick="openLog()">Log past workout</button></div>';
  S.hist.forEach(function(h,hi){
    var name=(S[h.k]&&S[h.k].name)||("Workout "+h.k);
    html+='<div class="card"><div class="label">'+new Date(h.at).toLocaleString()+'</div><div class="name" style="font-size:20px">'+esc(name)+'</div>';
    if(h.lifts&&h.lifts.length){
      h.lifts.forEach(function(L,li){
        var sets="";
        if(L.sets) L.sets.forEach(function(s,i){sets+=(i?", ":"")+(s.ok===1?"✓":s.ok===2?"✕":"·")+s.r});
        html+='<p style="margin:8px 0">'+esc(L.n)+' · '+L.w+' '+u()+(sets?" · "+sets:"")+(L.hit?" · hit":"")+'</p>';
        if(!hi) html+='<div class="row"><button class="icon" onclick="fixHist(0,'+li+',-step())">−'+step()+'</button><button class="icon" onclick="fixHist(0,'+li+',step())">+'+step()+'</button><span class="muted">Fix last workout weight</span></div>';
      });
    } else {
      html+='<p class="muted">Logged before detailed history. Weight from that day was not stored.</p>';
    }
    html+='</div>';
  });
  html+='<button class="btn" onclick="go(\'home\')">Back home</button>';
  return html;
}
function fixHist(hi,li,d){
  var h=S.hist[hi]; if(!h||!h.lifts||!h.lifts[li])return;
  var L=h.lifts[li];
  L.w=Math.max(0,Math.round((+L.w+d)*2)/2);
  if(L.id) bump(L.id,function(x){x.w=L.w});
  save(); toast(L.n+" set to "+L.w+" "+u()); draw();
}
function pad2(n){n=String(n);return n.length<2?"0"+n:n}
function ymdOf(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function yesterdayYmd(){var d=new Date();d.setDate(d.getDate()-1);return ymdOf(d)}
function atLocalNoon(ymd){
  var p=String(ymd||"").split("-");
  if(p.length!==3) return NaN;
  var y=+p[0],m=+p[1],d=+p[2];
  if(!y||!m||!d) return NaN;
  return new Date(y,m-1,d,12,0,0,0).getTime();
}
function fillLogLifts(){
  var w=S[logForm.k];
  if(!w||!w.ex){logForm.lifts=[];return}
  logForm.lifts=w.ex.filter(function(e){return !e.optional||(e.n&&String(e.n).trim())}).map(function(e){
    return {id:e.id,n:e.n,s:e.s,r:e.r,w:e.w,hit:1};
  });
}
function initLogForm(){
  logForm={date:yesterdayYmd(),k:next(),lifts:[]};
  fillLogLifts();
}
function openLog(){initLogForm();go("log")}
function setLogDay(k){logForm.k=k;fillLogLifts();draw()}
function setLogW(i,v){v=+v;if(!isFinite(v)||!logForm.lifts[i])return;logForm.lifts[i].w=v}
function nudgeLog(i,d){
  var L=logForm.lifts[i]; if(!L)return;
  L.w=Math.max(0,Math.round((+L.w+d)*2)/2); draw();
}
function setLogHit(i,hit){if(!logForm.lifts[i])return;logForm.lifts[i].hit=hit?1:0;draw()}
function logView(){
  var html=header("Log past workout",1)+
    '<div class="card"><div class="label">Date</div>'+
    '<input type="date" value="'+esc(logForm.date)+'" onchange="logForm.date=this.value">'+
    '<div class="label" style="margin-top:12px">Which day</div>';
  dayKeys().forEach(function(dk){
    html+='<button class="btn'+(dk===logForm.k?'':' btn2')+'" onclick="setLogDay(\''+dk+'\')">'+esc(S[dk].name)+'</button>';
  });
  html+='</div>';
  logForm.lifts.forEach(function(L,i){
    html+='<div class="card"><div class="label">'+esc(L.n)+' · '+scheme(L)+'</div>'+
      '<div class="row">'+
      '<button class="icon" onclick="nudgeLog('+i+',-step())">−'+step()+'</button>'+
      '<input type="number" inputmode="decimal" step="0.5" value="'+L.w+'" onchange="setLogW('+i+',this.value)">'+
      '<div class="unit">'+u()+'</div>'+
      '<button class="icon" onclick="nudgeLog('+i+',step())">+'+step()+'</button></div>'+
      '<div class="set '+(L.hit?'hit':'miss')+'"><div class="tag">'+(L.hit?'HIT':'MISS')+'</div><div></div>'+
      '<button class="icon go" onclick="setLogHit('+i+',1)">✓</button>'+
      '<button class="icon no" onclick="setLogHit('+i+',0)">✕</button></div></div>';
  });
  html+='<button class="btn" onclick="saveLog()">Save</button>'+
    '<button class="btn btn2" onclick="go(\'hist\')">Cancel</button>';
  return html;
}
function saveLog(){
  if(!logForm||dayKeys().indexOf(logForm.k)<0){toast("Pick a day");return}
  if(!logForm.lifts.length){toast("No lifts");return}
  var at=atLocalNoon(logForm.date);
  if(!isFinite(at)){toast("Pick a date");return}
  var newest=!S.hist.some(function(h){return (+h.at||0)>at});
  S.hist.push({
    k:logForm.k,
    at:at,
    lifts:logForm.lifts.map(function(L){
      var sets=[],i,hit=L.hit?1:0;
      for(i=0;i<L.s;i++) sets.push({r:L.r,ok:hit?1:2});
      return {id:L.id,n:L.n,w:+L.w||0,s:L.s,r:L.r,sets:sets,hit:!!hit};
    })
  });
  S.hist.sort(function(a,b){return (+b.at||0)-(+a.at||0)});
  S.hist=S.hist.slice(0,40);
  if(newest){
    S.last=logForm.k;
    logForm.lifts.forEach(function(L){
      if(!L.id) return;
      var w=+L.w||0;
      bump(L.id,function(x){x.w=w});
    });
  }
  save();
  toast("Logged");
  go("hist");
}
function liftKey(L){
  var raw=(L.id||"").toLowerCase();
  if(raw==="squat"||raw==="bench"||raw==="ohp"||raw==="row"||raw==="dl") return raw;
  var n=(L.n||"").toLowerCase();
  if(n.indexOf("squat")>=0) return "squat";
  if(n.indexOf("bench")>=0) return "bench";
  if(n.indexOf("row")>=0) return "row";
  if(n.indexOf("dead")>=0) return "dl";
  if(n.indexOf("overhead")>=0||n.indexOf("press")>=0) return "ohp";
  return n.replace(/[^a-z0-9]+/g,"");
}
function e1rm(w,r){r=+r||5;w=+w||0;return Math.round(w*(1+r/30))}
function volOf(L){
  if(!L) return 0;
  if(L.sets&&L.sets.length) return L.sets.reduce(function(t,s){return t+(+L.w||0)*(+s.r||0)},0);
  return (+L.w||0)*(+L.s||0)*(+L.r||0);
}
function repsOf(L){
  if(!L) return 0;
  if(L.sets&&L.sets.length) return L.sets.reduce(function(t,s){return t+(+s.r||0)},0);
  return (+L.s||0)*(+L.r||0);
}
function liftE1rm(L){
  if(!L) return null;
  var w=+L.w||0, best=null;
  if(L.sets&&L.sets.length){
    L.sets.forEach(function(s){
      var r=+s.r||0;
      if(r<1||r>12) return;
      var v=e1rm(w,r);
      if(best==null||v>best) best=v;
    });
    return best;
  }
  var r=+L.r||0;
  return (r>=1&&r<=12)?e1rm(w,r):null;
}
function inDays(at,n){return (Date.now()-at)<n*86400000}
function spark(vals,big){
  if(!vals.length) return '<p class="muted">No logged sets yet. Finish workouts to fill the chart.</p>';
  var mx=Math.max.apply(null,vals.concat([1])), h=big?88:40;
  return '<div class="spark'+(big?' big':'')+'">'+vals.map(function(v){return '<i style="height:'+Math.max(4,Math.round(h*v/mx))+'px"></i>'}).join("")+'</div>';
}
function setGraph(m){S.graph=m;save();draw()}
function programLifts(){
  var seen={}, list=[];
  dayKeys().forEach(function(k){
    S[k].ex.forEach(function(e){
      if(e.optional&&!e.n) return;
      if(seen[e.id]) return;
      seen[e.id]=1;
      list.push({id:e.id,n:e.n,w:e.w});
    });
  });
  return list;
}
function weekDots(){
  var hit={};
  S.hist.forEach(function(h){
    var d=new Date(h.at);
    hit[d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()]=1;
  });
  var start=new Date();
  start.setHours(0,0,0,0);
  start.setDate(start.getDate()-55);
  start.setDate(start.getDate()-start.getDay());
  var today=new Date(); today.setHours(0,0,0,0);
  var html='<div class="wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="cal">';
  for(var i=0;i<63;i++){
    var d=new Date(start.getTime()+i*86400000);
    if(d>today && d.getDay()===0 && i>0) break;
    var key=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
    html+='<i class="'+(hit[key]?"on":"")+(d>today?" fut":"")+'"></i>';
  }
  return html+'</div>';
}
function currentW(id){
  var w=0;
  dayKeys().forEach(function(k){S[k].ex.forEach(function(e){if(e.id===id)w=e.w})});
  return w;
}
function progView(){
  var week=S.hist.filter(function(h){return inDays(h.at,7)}).length;
  var month=S.hist.filter(function(h){return inDays(h.at,30)}).length;
  var sq=currentW("squat"), bp=currentW("bench"), dl=currentW("dl");
  var total=sq+bp+dl;
  var by={};
  S.hist.slice().reverse().forEach(function(h){
    if(!h.lifts) return;
    h.lifts.forEach(function(L){
      var k=L.id||liftKey(L); if(!k) return;
      if(!by[k]) by[k]={n:L.n,id:L.id,w:[],e1:[],vol:[],reps:[],pr:0,last:null};
      by[k].n=L.n;
      by[k].w.push(+L.w||0);
      var est=liftE1rm(L);
      if(est!=null) by[k].e1.push(est);
      by[k].vol.push(volOf(L));
      by[k].reps.push(repsOf(L));
      if((+L.w||0)>by[k].pr) by[k].pr=+L.w;
      by[k].last=L;
    });
  });
  var gmode=graph();
  var labels={w:"Weight",e1rm:"e1RM",vol:"Volume",reps:"Reps"};
  var html=header("Progress",1)+
    '<div class="card"><div class="label">Consistency</div><div class="stats">'+
    '<div class="stat"><div class="label">Week</div><div class="n">'+week+'</div></div>'+
    '<div class="stat"><div class="label">30 days</div><div class="n">'+month+'</div></div>'+
    '<div class="stat"><div class="label">All</div><div class="n">'+S.hist.length+'</div></div></div>'+
    weekDots()+
    '<p class="muted" style="margin-top:8px">Filled circle = a finished session. '+esc(programName())+' · rest '+ (S.rest||90) +'s.</p></div>'+
    '<div class="card"><div class="label">Powerlifting total</div><div class="name">'+total+' '+u()+'</div>'+
    '<p class="muted">Squat '+sq+' + bench '+bp+' + deadlift '+dl+' (current working weights)</p></div>'+
    '<div class="card"><div class="label">Charts</div>'+
    '<div class="seg">'+
    '<button class="'+(gmode==="w"?"on":"")+'" onclick="setGraph(\'w\')">Weight</button>'+
    '<button class="'+(gmode==="e1rm"?"on":"")+'" onclick="setGraph(\'e1rm\')">e1RM</button>'+
    '<button class="'+(gmode==="vol"?"on":"")+'" onclick="setGraph(\'vol\')">Volume</button>'+
    '<button class="'+(gmode==="reps"?"on":"")+'" onclick="setGraph(\'reps\')">Reps</button></div>'+
    '<p class="muted" style="margin-top:8px">e1RM uses Epley and only counts sets of 12 reps or fewer.</p></div>';
  programLifts().forEach(function(lift){
    var cur=lift.w, g=by[lift.id]||{n:lift.n,w:[],e1:[],vol:[],reps:[],pr:cur,last:null};
    if(!g.pr) g.pr=cur;
    var last=g.last;
    var est=liftE1rm(last);
    if(est==null && last && (+last.r||0)>12) est=null;
    else if(est==null && cur){
      var pr=5;
      dayKeys().forEach(function(k){S[k].ex.forEach(function(e){if(e.id===lift.id)pr=e.r})});
      est=pr<=12?e1rm(cur,pr):null;
    }
    var lastVol=g.vol.length?g.vol[g.vol.length-1]:0;
    var series=gmode==="e1rm"?g.e1:gmode==="vol"?g.vol:gmode==="reps"?g.reps:g.w;
    html+='<div class="card"><div class="label">'+esc(g.n||lift.n)+'</div>'+
      '<div class="stats">'+
      '<div class="stat"><div class="label">Now</div><div class="n">'+(cur||"—")+'</div></div>'+
      '<div class="stat"><div class="label">Best</div><div class="n">'+(g.pr||"—")+'</div></div>'+
      '<div class="stat"><div class="label">e1RM</div><div class="n">'+(est!=null?est:"—")+'</div></div></div>'+
      '<p class="muted" style="margin-top:8px">'+labels[gmode]+' over time'+(lastVol?' · last volume '+lastVol+" "+u():"")+'</p>'+
      (gmode==="e1rm"&&!series.length?'<p class="muted">e1RM needs sets of 12 reps or fewer.</p>':spark(series,1))+
      '</div>';
  });
  html+='<p class="muted">e1RM is an estimate from Epley (weight × (1 + reps/30)). Charts use logged sessions for lifts in the current program.</p>';
  html+='<button class="btn" onclick="go(\'hist\')">Open history</button><button class="btn btn2" onclick="go(\'home\')">Back home</button>';
  return html;
}
function quitSess(){
  if(!confirm("Quit workout?"))return;
  dropWake();
  if(timer)clearInterval(timer);timer=null;left=0;restEnds=0;
  sess=null;S.sess=null;save();go("home");
}
function resetApp(){
  if(!confirm("Reset all data?"))return;
  dropWake();
  if(timer)clearInterval(timer);timer=null;left=0;restEnds=0;
  sess=null;lastRes=[];
  try{localStorage.removeItem(K)}catch(e){}
  S=clone(D); quiz={step:0,goal:null,daysWk:null,gear:null}; pickFrom="onboard"; go("quiz");
}
function expData(){
  try{
    var blob=new Blob([localStorage.getItem(K)||JSON.stringify(S)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="forge-ab-v1.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  }catch(e){toast("Export failed")}
}
function impData(){
  var inp=document.createElement("input");
  inp.type="file";inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var p=JSON.parse(r.result);
        if(!p||typeof p!=="object"||Array.isArray(p))throw new Error("bad");
        if(!confirm("Replace all Forge data on this device?"))return;
        dropWake();
        if(timer)clearInterval(timer);timer=null;left=0;restEnds=0;sess=null;
        S=mergeSave(p); save();
        if(skipQuiz(p)) go("home"); else {quiz={step:0,goal:null,daysWk:null,gear:null};go("quiz")}
        toast("Imported");
      }catch(e){toast("Import failed")}
    };
    r.readAsText(f);
  };
  inp.click();
}
function restoreOpen(){
  var p=S.sess;
  if(!p||!p.ex||!p.ex.length)return;
  if(dayKeys().indexOf(p.k)<0 && p.k!=="A"&&p.k!=="B"&&p.k!=="C")return;
  sess={k:p.k,i:+p.i||0,ex:p.ex};
  if(sess.i<0||sess.i>=sess.ex.length)sess.i=0;
  lastMarked=+p.lastMarked||0;
  restEnds=+p.restEnds||0;
  if(restEnds>Date.now()){
    left=Math.max(0,Math.round((restEnds-Date.now())/1000));
    restTold=0;
    if(timer)clearInterval(timer);
    timer=setInterval(tick,250);
  }else{
    restEnds=0;left=0;restTold=1;
  }
  view="sess";
  keepAwake();
}
function navState(){return {view:view,qs:quiz.step,pf:pickFrom}}
function isRootView(){return view==="home"||(view==="quiz"&&quiz.step===0)}
function isSpoke(v){
  return v==="prog"||v==="hist"||v==="log"||v==="done"||v==="sess"||v==="editA"||v==="editB"||v==="editC"||(v==="pick"&&pickFrom==="change");
}
function logoTap(){
  if(view==="home") return;
  if(view==="quiz"&&quiz.step===0) return;
  if((view==="quiz"&&quiz.step>=1)||(view==="pick"&&pickFrom==="onboard")){
    history.back();
    return;
  }
  go("home");
}
function go(v,fromPop){
  if(view==="sess" && v!=="sess"){
    persistSess();
    dropWake();
  }
  var prev=view;
  view=v;
  if(!fromPop){
    try{
      if(isSpoke(v)&&isSpoke(prev)) history.replaceState(navState(),"",location.href);
      else history.pushState(navState(),"",location.href);
    }catch(e){}
  }
  draw();
}
function bootHist(){
  try{
    if(view==="sess"){
      history.replaceState({view:"home",qs:quiz.step,pf:pickFrom},"",location.href);
      history.pushState(navState(),"",location.href);
    }else{
      history.replaceState(navState(),"",location.href);
      if(isRootView()) history.pushState(navState(),"",location.href);
    }
  }catch(e){}
}
window.addEventListener("popstate",function(e){
  if(isRootView()){
    try{ history.pushState(navState(),"",location.href); }catch(err){}
    return;
  }
  var st=e.state;
  if(!st||!st.view){
    try{ history.pushState(navState(),"",location.href); }catch(err){}
    return;
  }
  if(st.view==="sess"&&!sess){
    restoreOpen();
    if(!sess){ go("home",true); return; }
  }
  if(st.qs!=null) quiz.step=st.qs;
  if(st.pf) pickFrom=st.pf;
  go(st.view,true);
  if(isRootView()){
    try{ history.pushState(navState(),"",location.href); }catch(err){}
  }
});
function draw(){
  applyTheme();
  var a=document.getElementById("app");
  try{
    if(view==="quiz")a.innerHTML=quizView();
    else if(view==="pick")a.innerHTML=pickView();
    else if(view==="home")a.innerHTML=home();
    else if(view==="sess")a.innerHTML=sessView();
    else if(view==="done")a.innerHTML=doneView();
    else if(view==="editA")a.innerHTML=editView("A");
    else if(view==="editB")a.innerHTML=editView("B");
    else if(view==="editC")a.innerHTML=editView("C");
    else if(view==="hist")a.innerHTML=histView();
    else if(view==="log"){if(!logForm)initLogForm();a.innerHTML=logView()}
    else if(view==="prog")a.innerHTML=progView();
  }catch(err){a.innerHTML='<div class="card">Error: '+esc(err.message)+'</div>'}
}
restoreOpen();
bootHist();
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
