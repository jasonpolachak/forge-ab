<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Forge"/>
<meta name="theme-color" content="#101214"/>
<title>Forge 0.5.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#101214;color:#f6f3ec;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:#f0b429;color:#14110a;font-weight:800;display:grid;place-items:center}
h1,p{margin:0}
small{display:block;color:#b0b8c2;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ver{font-size:11px;font-weight:800;background:#f0b429;color:#14110a;border-radius:99px;padding:4px 8px}
.card{background:#222830;border:1px solid #3a4350;border-radius:16px;padding:16px;margin-bottom:12px}
.label{color:#b0b8c2;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.name{font-size:26px;font-weight:800}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:16px;margin-top:8px;color:#14110a;background:#f0b429}
.btn2{background:transparent;color:#f6f3ec;border:1px solid #3a4350}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input{width:100%;background:#181c21;border:1px solid #3a4350;border-radius:10px;padding:10px;color:#f6f3ec;font:inherit}
.set{display:grid;grid-template-columns:32px 1fr 52px 52px;gap:8px;align-items:center;background:#181c21;border:2px solid #3a4350;border-radius:14px;padding:10px;margin-top:10px}
.set.hit{background:#143322;border-color:#3dba7a}
.set.miss{background:#3a1c18;border-color:#e15b4a}
.set .tag{font-size:11px;font-weight:800;letter-spacing:.06em}
.set.hit .tag{color:#3dba7a}
.set.miss .tag{color:#ffb4ab}
.icon{width:52px;height:52px;border:0;border-radius:14px;background:#2a333d;color:#f6f3ec;font-size:22px;font-weight:800}
.set.hit .icon.go{background:#3dba7a;color:#062214}
.set.miss .icon.no{background:#e15b4a;color:#2a0c0a}
.muted{color:#b0b8c2;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a3038;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;z-index:30}
.toast.show{opacity:1}
.unit{flex:0 0 48px;text-align:center;font-weight:800}
.status{background:#1c2430;border-radius:12px;padding:12px;margin-bottom:12px}
.clock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.restbar{position:sticky;bottom:0;margin:16px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#0e2a1c;border-top:2px solid #3dba7a;z-index:20}
.restbar.go{background:#0e2a1c}
.restbar.done{background:#2a2410;border-top-color:#f0b429}
</style>
</head>
<body>
<div class="app" id="app">Loading…</div>
<div class="toast" id="toast"></div>
<script>
var V="0.5.1",K="forge-ab-v1";
var D={units:"lb",rest:90,last:null,fail:{},hist:[],
A:{name:"Workout A",ex:[
{id:"squat",n:"Squat",s:5,r:5,inc:5,w:45},
{id:"bench",n:"Bench Press",s:5,r:5,inc:5,w:45},
{id:"row",n:"Barbell Row",s:5,r:5,inc:5,w:65}]},
B:{name:"Workout B",ex:[
{id:"squat",n:"Squat",s:5,r:5,inc:5,w:45},
{id:"ohp",n:"Overhead Press",s:5,r:5,inc:5,w:45},
{id:"dl",n:"Deadlift",s:1,r:5,inc:10,w:95}]}};
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{var p=JSON.parse(localStorage.getItem(K)||"null");if(!p)return clone(D);
    var o=clone(D);["units","rest","last","fail","hist","A","B"].forEach(function(k){if(p[k]!=null)o[k]=p[k]});return o;
  }catch(e){return clone(D)}
}
var S=load(),view="home",sess=null,timer=null,left=0,restEnds=0,lastRes=[],lastMarked=0,restTold=0;
if(!S.rest) S.rest=90;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1600)}
function next(){return S.last==="A"?"B":"A"}
function u(){return S.units==="kg"?"kg":"lb"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return ({"&":"&","<":"<",">":">",'"':'"'})[c]})}
function bump(id,fn){["A","B"].forEach(function(k){S[k].ex.forEach(function(e){if(e.id===id)fn(e)})})}
function header(title,back){
  return '<div class="top"><div class="brand">'+(back?'<button class="icon" onclick="go(\'home\')">←</button>':'<div class="logo">F</div>')+
    '<div><h1>'+title+'</h1><small>Two workouts. Add weight.</small></div></div><span class="ver">v'+V+'</span></div>';
}
function home(){
  var k=next(),w=S[k],o=k==="A"?"B":"A",h=S.hist[0]||null,html=header("Forge")+
    '<div class="card"><div class="label">Up next</div><div class="name">'+esc(w.name)+'</div>';
  w.ex.forEach(function(e,i){
    html+='<div class="label" style="margin-top:10px">'+esc(e.n)+' · '+e.s+'×'+e.r+'</div><div class="row">'+
      '<input type="number" inputmode="decimal" step="0.5" value="'+e.w+'" onchange="setW(\''+k+'\','+i+',this.value)">'+
      '<div class="unit">'+u()+'</div></div>';
  });
  html+='<button class="btn" onclick="start(\''+k+'\')">Start '+esc(w.name)+'</button>'+
    '<button class="btn btn2" onclick="start(\''+o+'\')">Do '+esc(S[o].name)+' instead</button>'+
    '<button class="btn btn2" onclick="go(\'editA\')">Edit Workout A</button>'+
    '<button class="btn btn2" onclick="go(\'editB\')">Edit Workout B</button></div>';
  html+='<div class="card"><div class="label">Sessions</div><p class="name">'+(S.hist.length)+'</p>'+
    '<p class="muted">'+(h?("Last: "+S[h.k].name+" · "+new Date(h.at).toLocaleDateString()):"No sessions yet")+'</p>'+
    '<div class="label" style="margin-top:10px">Rest between sets (seconds)</div>'+
    '<input type="number" value="'+S.rest+'" min="30" step="15" onchange="S.rest=+this.value||90;save()">'+
    '<button class="btn btn2" onclick="toggleU()">Units: '+u()+'</button></div>';
  return html;
}
function setW(k,i,v){
  v=+v; if(!isFinite(v))return;
  var e=S[k].ex[i]; e.w=v; bump(e.id,function(x){x.w=v}); save(); toast("Weight saved");
}
function toggleU(){S.units=S.units==="lb"?"kg":"lb";save();draw()}
function start(k){
  var w=S[k];
  sess={k:k,i:0,ex:w.ex.map(function(e){
    var log=[]; for(var i=0;i<e.s;i++) log.push({r:e.r,ok:0});
    return {id:e.id,n:e.n,s:e.s,r:e.r,inc:e.inc,w:e.w,log:log};
  })};
  left=0; restEnds=0; lastMarked=0; view="sess"; draw();
}
function doneCount(e){return e.log.filter(function(s){return s.ok}).length}
function sessView(){
  var e=sess.ex[sess.i], dc=doneCount(e);
  var html='<div class="top"><button class="icon" onclick="if(confirm(\'Quit session?\')){sess=null;go(\'home\')}">✕</button>'+
    '<div><div class="label" style="margin:0">'+esc(S[sess.k].name)+'</div><p class="muted">'+(sess.i+1)+' of '+sess.ex.length+' lifts</p></div>'+
    '<span class="ver">v'+V+'</span></div>';
  html+='<div class="card"><div class="label">Now lifting</div><div class="name">'+esc(e.n)+'</div>'+
    '<p class="muted">'+e.s+' sets × '+e.r+' reps @ <b>'+e.w+' '+u()+'</b></p>'+
    '<div class="status"><b>'+dc+' of '+e.s+' sets logged</b><br><span class="muted">'+
    (dc<e.s?('Tap the green check after set '+(dc+1)+'.'):'All sets logged. Go to next lift.')+'</span></div></div>';
  e.log.forEach(function(s,i){
    var st=s.ok===1?'hit':s.ok===2?'miss':'';
    var tag=s.ok===1?'DONE':s.ok===2?'MISS':('SET '+(i+1));
    html+='<div class="set '+st+'"><div class="tag">'+tag+'</div><div class="row" style="margin:0">'+
      '<button class="icon" onclick="chg('+i+',-1)">−</button><b>'+s.r+'</b>'+
      '<button class="icon" onclick="chg('+i+',1)">+</button></div>'+
      '<button class="icon go" onclick="mark('+i+',1)">✓</button>'+
      '<button class="icon no" onclick="mark('+i+',2)">✕</button></div>';
  });
  if(dc===e.s) html+='<button class="btn" onclick="nxt()">'+(sess.i<sess.ex.length-1?'Next lift':'Finish workout')+'</button>';
  html+='<button class="btn btn2" onclick="nxt()">Skip lift</button>';
  if(left>0){
    html+='<div class="restbar go"><div class="label">Rest — next set in</div><div class="clock" id="clock">'+fmt(left)+'</div>'+
      '<p class="muted">Set '+(lastMarked+1)+' logged. Rest, then do set '+(lastMarked+2<=e.s?lastMarked+2:e.s)+'.</p>'+
      '<button class="btn btn2" onclick="stopT()">Skip rest</button></div>';
  } else if(dc>0 && dc<e.s){
    html+='<div class="restbar done"><div class="label">Ready</div><div class="name">Do set '+(dc+1)+' now</div></div>';
  }
  return html;
}
function chg(i,d){sess.ex[sess.i].log[i].r=Math.max(0,sess.ex[sess.i].log[i].r+d);draw()}
function tick(){
  if(!restEnds){left=0;return}
  left=Math.max(0,Math.round((restEnds-Date.now())/1000));
  var c=document.getElementById("clock");
  if(c) c.textContent=fmt(left);
  if(left<=0){
    restEnds=0;
    if(timer){clearInterval(timer);timer=null}
    if(!restTold){
      restTold=1;
      toast("Rest over — next set");
      if(navigator.vibrate) navigator.vibrate([200,80,200]);
    }
    draw();
  }
}
function mark(i,ok){
  sess.ex[sess.i].log[i].ok=ok;
  lastMarked=i;
  restTold=0;
  if(timer)clearInterval(timer);
  restEnds=Date.now()+(S.rest||90)*1000;
  left=S.rest||90;
  timer=setInterval(tick,250);
  toast(ok===1?("Set "+(i+1)+" done"):("Set "+(i+1)+" missed"));
  draw();
}
function stopT(){if(timer)clearInterval(timer);timer=null;left=0;restEnds=0;draw()}
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
window.addEventListener("focus",tick);
window.addEventListener("pageshow",tick);
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=String(s%60);if(x.length<2)x="0"+x;return m+":"+x}
function nxt(){
  if(sess.i<sess.ex.length-1){left=0;restEnds=0;if(timer)clearInterval(timer);timer=null;sess.i++;draw();return}
  lastRes=sess.ex.map(function(e){
    var hit=e.log.every(function(s){return s.ok===1&&s.r>=e.r});
    var miss=e.log.some(function(s){return s.ok===2||s.r<e.r});
    return {id:e.id,n:e.n,w:e.w,hit:hit,miss:miss};
  });
  lastRes.forEach(function(r){
    if(r.hit){S.fail[r.id]=0;bump(r.id,function(e){e.w=Math.round((e.w+e.inc)*2)/2})}
    else if(r.miss){S.fail[r.id]=(S.fail[r.id]||0)+1;if(S.fail[r.id]>=3){bump(r.id,function(e){e.w=Math.round(Math.max(S.units==="kg"?20:45,e.w*0.9)*2)/2});S.fail[r.id]=0}}
  });
  S.last=sess.k;
  S.hist.unshift({k:sess.k,at:Date.now()});
  S.hist=S.hist.slice(0,40);
  save(); sess=null; view="done"; draw();
}
function doneView(){
  var html=header("Saved",1)+'<div class="card">';
  lastRes.forEach(function(r){html+='<p style="margin:8px 0">'+esc(r.n)+' · '+(r.hit?"hit — weight up next time":"same weight")+' · '+r.w+' '+u()+'</p>'});
  html+='</div><button class="btn" onclick="go(\'home\')">Back home</button>';
  return html;
}
function editView(k){
  var w=S[k],html=header("Edit "+k,1)+'<div class="card"><div class="label">Workout name</div>'+
    '<input value="'+esc(w.name)+'" onchange="S.'+k+'.name=this.value;save()">';
  w.ex.forEach(function(e,i){
    html+='<div class="label" style="margin-top:12px">Lift '+(i+1)+'</div>'+
      '<input value="'+esc(e.n)+'" onchange="S.'+k+'.ex['+i+'].n=this.value;save()">'+
      '<div class="row"><input type="number" value="'+e.s+'" onchange="S.'+k+'.ex['+i+'].s=+this.value;save()" placeholder="sets">'+
      '<input type="number" value="'+e.r+'" onchange="S.'+k+'.ex['+i+'].r=+this.value;save()" placeholder="reps"></div>'+
      '<div class="row"><input type="number" step="0.5" value="'+e.w+'" onchange="var v=+this.value;S.'+k+'.ex['+i+'].w=v;bump(\''+e.id+'\',function(x){x.w=v});save()">'+
      '<input type="number" step="0.5" value="'+e.inc+'" onchange="S.'+k+'.ex['+i+'].inc=+this.value;save()"></div>'+
      '<p class="muted">Weight · add when you hit all sets</p>'+
      '<button class="btn btn2" onclick="S.'+k+'.ex.splice('+i+',1);save();draw()">Remove lift</button>';
  });
  html+='<button class="btn" onclick="S.'+k+'.ex.push({id:\'ex\'+Math.random().toString(36).slice(2,7),n:\'New lift\',s:3,r:8,inc:5,w:'+(S.units==="kg"?20:45)+'});save();draw()">+ Add lift</button></div>';
  html+='<button class="btn btn2" onclick="if(confirm(\'Reset all data?\')){S=clone(D);save();go(\'home\')}">Reset app</button>';
  return html;
}
function go(v){view=v==="editA"?"editA":v==="editB"?"editB":v;draw()}
function draw(){
  var a=document.getElementById("app");
  try{
    if(view==="home")a.innerHTML=home();
    else if(view==="sess")a.innerHTML=sessView();
    else if(view==="done")a.innerHTML=doneView();
    else if(view==="editA")a.innerHTML=editView("A");
    else if(view==="editB")a.innerHTML=editView("B");
  }catch(err){a.innerHTML='<div class="card">Error: '+esc(err.message)+'</div>'}
}
draw();
</script>
</body>
</html>
